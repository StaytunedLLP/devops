name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Dagger check profile to run.
        required: false
        default: full
        type: choice
        options:
          - pr
          - main
          - nightly
          - full

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  checks:
    name: Dagger Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Dagger CLI
        shell: bash
        run: |
          set -euo pipefail

          # Read the version from this repository's own dagger.json rather than
          # repeating it here. daggerverse is the authority -- engineVersion is
          # what the module loader enforces -- so a literal in this file is a
          # copy that can disagree with the module it installs a CLI for.
          #
          # staydevops mirrors this value in .github/dagger-version and its
          # dagger-version-drift workflow fails when the two diverge. That guard
          # is pointless if the authority itself carries a second copy.
          version="$(jq -r .engineVersion dagger.json)"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error file=dagger.json::engineVersion is missing or empty."
            exit 1
          fi
          echo "Installing Dagger ${version} from dagger.json"

          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION="${version}" BIN_DIR="$INSTALL_DIR" sh
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Resolve check pattern
        id: pattern
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            pattern="checks:*-incremental"
          else
            pattern="checks:*-full"
          fi
          echo "pattern=${pattern}" >> "$GITHUB_OUTPUT"

      - name: Run Dagger checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN != '' && secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dagger check -m . "${{ steps.pattern.outputs.pattern }}"

  ods:
    name: ODS Document Integrity Gate
    uses: open-doc-spec/ods-action/.github/workflows/ods.yml@main
    with:
      runs-on: "ubuntu-latest"
      path: "."
      doctor: true
      strict-fmt: true
